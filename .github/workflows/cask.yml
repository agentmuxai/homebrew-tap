name: cask

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test scripts/render-cask.test.mjs
  cask:
    runs-on: macos-latest
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Plain ASCII, unix line ends
        run: |
          if grep -nP '[^\x0a\x20-\x7e]' Casks/agentmux.rb; then echo "non-ASCII or CR in the cask"; exit 1; fi
      - name: Tap this checkout
        run: |
          brew tap agentmuxai/tap "$GITHUB_WORKSPACE"
      - name: What a user sees before trusting the tap (informational)
        continue-on-error: true
        run: |
          brew install --cask agentmuxai/tap/agentmux 2>&1 | tail -8
          brew uninstall --cask agentmuxai/tap/agentmux 2>&1 | tail -2 || true
      - name: Trust this tap (our own checkout)
        run: brew trust agentmuxai/tap
      - name: Style
        run: brew style agentmuxai/tap/agentmux
      - name: Audit
        run: brew audit --cask --strict --online agentmuxai/tap/agentmux
      - name: Install, check, uninstall
        run: |
          brew install --cask agentmuxai/tap/agentmux
          test -d /Applications/AgentMux.app
          brew uninstall --cask agentmuxai/tap/agentmux
          test ! -d /Applications/AgentMux.app
