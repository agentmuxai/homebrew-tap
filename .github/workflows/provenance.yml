name: provenance

# The required check that a cask came from a signed release. It runs from MAIN, so the pull request cannot
# change the rule that judges it: main's renderer, main's pinned update-keys.json. The pull request's cask is
# fetched as plain data and compared; nothing from the pull request is checked out or run, and the job has
# no secret and read-only permissions.
#
# A pull request that does not touch Casks/agentmux.rb passes at once. One that does must carry exactly
# what main renders from the signed release the cask names, at a version not lower than main's (see
# scripts/provenance.mjs). A branch named bump-* may change nothing but the cask.
#
# pull_request_target covers every pull request opened by a person. A pull request opened by bump.yml's
# GITHUB_TOKEN starts no workflow, so bump.yml dispatches this one (the pr input) on the bump branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: provenance-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  provenance:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Prove the cask
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::the pull request number is not a number"; exit 1; }
          IFS=$'\t' read -r head_sha head_repo head_ref < <(gh api "repos/$REPO/pulls/$PR" --jq '[.head.sha, .head.repo.full_name, .head.ref] | @tsv')
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected head commit"; exit 1; }
          [[ "$head_repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::unexpected head repository"; exit 1; }
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | [.status, .filename, (.previous_filename // "")] | @tsv' > "$RUNNER_TEMP/files.tsv"
          touches=0
          others=0
          removed=0
          while IFS=$'\t' read -r status name prev; do
            if [ "$name" = "Casks/agentmux.rb" ] || [ "$prev" = "Casks/agentmux.rb" ]; then
              touches=1
              if [ "$status" = "removed" ] || [ "$status" = "renamed" ]; then removed=1; fi
            else
              others=1
            fi
          done < "$RUNNER_TEMP/files.tsv"
          if [ "$touches" = 0 ]; then
            echo "The pull request does not change the cask: nothing to prove."
            exit 0
          fi
          if [ "$removed" = 1 ]; then
            echo "::error::the cask is removed or renamed"
            exit 1
          fi
          if [[ "$head_ref" =~ ^bump- ]] && [ "$others" = 1 ]; then
            echo "::error::a bump branch may change nothing but Casks/agentmux.rb"
            exit 1
          fi
          # The pull request's cask, as data. Never run, never sourced.
          gh api -H "Accept: application/vnd.github.raw" "repos/$head_repo/contents/Casks/agentmux.rb?ref=$head_sha" > "$RUNNER_TEMP/pr-cask.rb"
          [ "$(wc -c < "$RUNNER_TEMP/pr-cask.rb")" -lt 5000 ] || { echo "::error::the cask is far larger than a cask should be"; exit 1; }
          ver="$(node scripts/provenance.mjs version "$RUNNER_TEMP/pr-cask.rb")"
          mkdir "$RUNNER_TEMP/release"
          gh release download "v$ver" -R agentmuxai/agentmux -D "$RUNNER_TEMP/release" \
            -p "AgentMux-$ver-manifest.json" \
            -p "AgentMux-$ver-envelope.json" \
            -p "AgentMux-$ver-envelope.json.sig"
          node scripts/provenance.mjs check "$RUNNER_TEMP/pr-cask.rb" Casks/agentmux.rb \
            "$RUNNER_TEMP/release/AgentMux-$ver-manifest.json" \
            "$RUNNER_TEMP/release/AgentMux-$ver-envelope.json" \
            "$RUNNER_TEMP/release/AgentMux-$ver-envelope.json.sig" \
            update-keys.json
