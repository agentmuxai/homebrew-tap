name: stale

# Says when Casks/agentmux.rb is behind the latest AgentMux release. Hourly, and on demand.
# It only reads: it checks the latest release's signed envelope against update-keys.json (a copy of the keys the
# app pins), and when the cask is behind it fails and opens, or updates, one issue ("The cask is behind the
# latest AgentMux release"). It opens no pull request and approves nothing: a workflow that may create pull
# requests may also approve them, and a workflow on any branch could use that to approve a pull request of its own,
# so that GitHub Actions setting stays off. The release's own steps bring the cask up to date (scripts/bump.sh,
# then an ordinary pull request); when the cask has caught up this workflow closes the issue.
#
# Every value that comes from outside (the release's tag, its files) is checked against a strict pattern
# first and reaches a script only through env:, never pasted into run: text.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: stale
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Is the cask behind the latest release?
        run: |
          title="The cask is behind the latest AgentMux release"
          tag="$(gh api repos/agentmuxai/agentmux/releases/latest --jq .tag_name)"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the latest release's tag is not of the form vX.Y.Z"
            exit 1
          fi
          ver="${tag#v}"
          cur="$(node scripts/provenance.mjs version Casks/agentmux.rb)"
          num="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
          newest="$(printf '%s\n%s\n' "$cur" "$ver" | sort -V | tail -n 1)"
          if [ "$cur" = "$ver" ] || [ "$newest" != "$ver" ]; then
            echo "The cask is at $cur and the latest release is $ver: nothing to do."
            if [ -n "$num" ]; then
              gh issue close "$num" --comment "The cask is at $cur and the latest release is $ver: it has caught up."
            fi
            exit 0
          fi
          # The release's files must be genuine and for this release before the issue calls it the latest.
          mkdir release
          gh release download "$tag" -R agentmuxai/agentmux -D release \
            -p "AgentMux-$ver-manifest.json" \
            -p "AgentMux-$ver-envelope.json" \
            -p "AgentMux-$ver-envelope.json.sig"
          node scripts/render-cask.mjs --signed \
            "release/AgentMux-$ver-manifest.json" \
            "release/AgentMux-$ver-envelope.json" \
            "release/AgentMux-$ver-envelope.json.sig" \
            update-keys.json > release/agentmux.rb
          rendered="$(node scripts/provenance.mjs version release/agentmux.rb)"
          if [ "$rendered" != "$ver" ]; then
            echo "::error::the signed manifest is for $rendered, not for the release $ver"
            exit 1
          fi
          body="The cask is at $cur and the latest AgentMux release is $ver.

          To catch up: from a clone of this repository run \`scripts/bump.sh $ver\` on a branch named \`bump-$ver\`, commit \`Casks/agentmux.rb\`, and open a pull request. It needs its checks and an approving review. This workflow does not open it: the GitHub Actions setting that lets a workflow create pull requests also lets it approve them, so it stays off."
          if [ -n "$num" ]; then
            gh issue edit "$num" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          echo "::error::the cask is at $cur, the latest release is $ver"
          exit 1
